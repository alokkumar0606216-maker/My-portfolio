<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System | Book Records & Catalog</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="library-app">
        <!-- Top Navigation -->
        <header class="lib-header">
            <div class="lib-brand">
                <a href="../../index.html" class="back-btn" title="Back to Portfolio"><i class="fa-solid fa-arrow-left"></i></a>
                <div class="brand-title">
                    <i class="fa-solid fa-book-bookmark"></i>
                    <h2>LibriTrack</h2>
                </div>
            </div>
            <div class="header-right">
                <button class="add-book-btn" id="open-modal-btn">
                    <i class="fa-solid fa-plus"></i> Add New Book
                </button>
                <button class="theme-toggle" id="theme-btn" title="Toggle Theme">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </header>

        <main class="lib-main">
            <!-- Summary Stats -->
            <section class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon total"><i class="fa-solid fa-books"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Total Books</span>
                        <h3 id="stat-total">0</h3>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon available"><i class="fa-solid fa-check"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Available</span>
                        <h3 id="stat-available">0</h3>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon issued"><i class="fa-solid fa-hand-holding-hand"></i></div>
                    <div class="stat-info">
                        <span class="stat-label">Issued / Borrowed</span>
                        <h3 id="stat-issued">0</h3>
                    </div>
                </div>
            </section>

            <!-- Table Card -->
            <section class="table-card">
                <div class="table-header">
                    <div class="search-wrap">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="Search by title, author, or genre...">
                    </div>
                    <div class="filter-wrap">
                        <select id="filter-status">
                            <option value="all">All Statuses</option>
                            <option value="Available">Available</option>
                            <option value="Issued">Issued</option>
                        </select>
                    </div>
                </div>

                <div class="table-container">
                    <table class="books-table">
                        <thead>
                            <tr>
                                <th>Book Title</th>
                                <th>Author</th>
                                <th>Genre</th>
                                <th>ISBN</th>
                                <th>Status</th>
                                <th class="text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="books-tbody">
                            <!-- Dynamic rows rendered via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- Add Book Modal -->
        <div class="modal" id="book-modal">
            <div class="modal-overlay" id="modal-overlay"></div>
            <div class="modal-dialog">
                <div class="modal-header">
                    <h3>Add New Book to Library</h3>
                    <button class="close-modal" id="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <form id="add-book-form" class="modal-form">
                    <div class="form-group">
                        <label for="book-title">Book Title</label>
                        <input type="text" id="book-title" placeholder="e.g. Clean Code" required>
                    </div>
                    <div class="form-group">
                        <label for="book-author">Author Name</label>
                        <input type="text" id="book-author" placeholder="e.g. Robert C. Martin" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="book-genre">Genre / Category</label>
                            <select id="book-genre">
                                <option value="Programming">Programming</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Fiction">Fiction</option>
                                <option value="Science">Science</option>
                                <option value="Business">Business</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="book-isbn">ISBN / Code</label>
                            <input type="text" id="book-isbn" placeholder="e.g. 978-0132350884" required>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn-cancel" id="cancel-modal-btn">Cancel</button>
                        <button type="submit" class="btn-submit">Add Book</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
